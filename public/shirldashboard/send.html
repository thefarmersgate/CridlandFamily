<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Send to Mum's frame</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@300&family=Barlow:wght@400;500;600;700&display=swap">
<style>
  :root{
    --ground:#0B0F13; --panel:#161C23; --line:#2C3741;
    --ink:#fff; --ink-2:#C2D0DA; --ink-3:#8496A4;
    --accent:#F2A54A; --ok:#5BD3A0; --bad:#FF5A50;
    --sans:"Barlow","Segoe UI",Arial,sans-serif;
    --disp:"Oswald","Barlow",Impact,sans-serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;min-height:100%;background:var(--ground);color:var(--ink);
    font-family:var(--sans);font-size:17px;line-height:1.4;
    display:flex;align-items:flex-start;justify-content:center;padding:28px 16px 48px}
  .card{width:min(520px,100%);display:flex;flex-direction:column;gap:18px}
  h1{font-family:var(--disp);font-weight:300;font-size:34px;letter-spacing:.04em;
     text-transform:uppercase;margin:0}
  p.lede{color:var(--ink-3);margin:0}
  label{display:flex;flex-direction:column;gap:7px;font-size:14px;font-weight:700;
    letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
  input,textarea{font:inherit;font-size:19px;padding:14px 16px;border-radius:12px;
    background:#101720;border:2px solid var(--line);color:var(--ink);width:100%}
  input:focus,textarea:focus{outline:none;border-color:var(--accent)}
  textarea{min-height:120px;resize:vertical}
  .count{font-size:13px;color:var(--ink-3);text-align:right;letter-spacing:0;text-transform:none;font-weight:500}
  button{font:inherit;font-size:18px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
    min-height:58px;border:0;border-radius:12px;background:var(--accent);color:#170F04;cursor:pointer}
  button[disabled]{opacity:.5;cursor:default}
  .msg{min-height:26px;font-weight:600}
  .msg.ok{color:var(--ok)} .msg.err{color:var(--bad)}
  .preview{background:#241B0E;border:1px solid rgba(242,165,74,.5);border-radius:12px;padding:14px 18px}
  .preview .l{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  .preview .t{font-size:19px;font-weight:600;margin-top:4px;min-height:26px}
  .note{font-size:14px;color:var(--ink-3)}
</style>
</head><body>
<form class="card" id="f" autocomplete="off">
  <div>
    <h1>Send to Mum's frame</h1>
    <p class="lede">It appears on the screen within a few seconds, and clears itself after about 12 hours.</p>
  </div>

  <label>Your name
    <input id="who" maxlength="24" required placeholder="Brenton">
  </label>

  <label>Message
    <textarea id="text" maxlength="180" required placeholder="Running a bit late &mdash; I'll be there about 3 o'clock."></textarea>
    <span class="count" id="count">0 / 180</span>
  </label>

  <label>PIN
    <input id="pin" type="password" inputmode="numeric" required placeholder="&bull;&bull;&bull;&bull;">
  </label>

  <div class="preview">
    <div class="l">Message from <span id="pwho">&mdash;</span></div>
    <div class="t" id="ptext"></div>
  </div>

  <button id="go" type="submit">Send</button>
  <div class="msg" id="msg" role="status" aria-live="polite"></div>
  <p class="note">Sending again replaces whatever is on the frame now.</p>
</form>

<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id);};
  try{ var last=localStorage.getItem("send_who"); if(last) $("who").value=last; }catch(e){}

  function sync(){
    $("count").textContent=$("text").value.length+" / 180";
    $("pwho").textContent=$("who").value.trim()||"—";
    $("ptext").textContent=$("text").value.trim();
  }
  $("who").addEventListener("input",sync);
  $("text").addEventListener("input",sync);
  sync();

  $("f").addEventListener("submit",function(e){
    e.preventDefault();
    var m=$("msg"); m.className="msg"; m.textContent="Sending…";
    $("go").disabled=true;
    fetch("/api/send",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({pin:$("pin").value,who:$("who").value,text:$("text").value})
    }).then(function(r){
      return r.json().then(function(j){ return {ok:r.ok,j:j}; });
    }).then(function(res){
      if(res.ok){
        m.className="msg ok"; m.textContent="Sent — it is on the frame now.";
        try{ localStorage.setItem("send_who",$("who").value.trim()); }catch(e){}
        $("text").value=""; $("pin").value=""; sync();
      }else{
        m.className="msg err"; m.textContent=(res.j&&res.j.error)||"Something went wrong.";
      }
    }).catch(function(){
      m.className="msg err"; m.textContent="No connection. Try again in a moment.";
    }).finally(function(){ $("go").disabled=false; });
  });
})();
</script>
</body></html>
