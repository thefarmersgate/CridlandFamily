<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Frame setup</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@300&family=Barlow:wght@400;500;600;700&display=swap">
<style>
  :root{
    --ground:#0B0F13; --panel:#161C23; --line:#2C3741;
    --ink:#fff; --ink-2:#C2D0DA; --ink-3:#8496A4;
    --accent:#F2A54A; --ok:#5BD3A0; --bad:#FF5A50; --wait:#8496A4;
    --sans:"Barlow","Segoe UI",Arial,sans-serif;
    --disp:"Oswald","Barlow",Impact,sans-serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
    font-size:17px;line-height:1.4;display:flex;justify-content:center;padding:28px 16px 48px}
  .card{width:min(620px,100%);display:flex;flex-direction:column;gap:22px}
  h1{font-family:var(--disp);font-weight:300;font-size:34px;letter-spacing:.04em;text-transform:uppercase;margin:0}
  h2{font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
  p.lede{color:var(--ink-3);margin:0}
  section{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  li{display:flex;gap:12px;align-items:baseline}
  .dot{flex:none;width:12px;height:12px;border-radius:50%;background:var(--wait);transform:translateY(1px)}
  .ok .dot{background:var(--ok)} .bad .dot{background:var(--bad)}
  .nm{font-weight:600}
  .note{color:var(--ink-3);font-size:15px;overflow-wrap:anywhere}
  input{font:inherit;font-size:19px;padding:14px 16px;border-radius:12px;background:#101720;
    border:2px solid var(--line);color:var(--ink);width:100%}
  input:focus{outline:none;border-color:var(--accent)}
  button{font:inherit;font-size:18px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
    min-height:54px;border:0;border-radius:12px;background:var(--accent);color:#170F04;cursor:pointer}
  .err{color:var(--bad);font-weight:600}
</style>
</head><body>
<div class="card">
  <h1>Frame setup</h1>
  <p class="lede">What is connected and what is still to do. Green is done, red is not.</p>

  <div id="gate" hidden>
    <p class="lede">Enter the setup key (the <b>KIOSK_KEY</b>).</p>
    <p><input id="key" type="password" autocomplete="off"></p>
    <button id="go" type="button">Check</button>
  </div>
  <p class="err" id="err" hidden></p>
  <div id="out"></div>

  <section id="pg">
    <h2>Find Ring device ids</h2>
    <p class="lede">Paste an access token from the Ring Playground. It is used once to list your devices and is not saved.</p>
    <p><input id="pgtok" type="password" autocomplete="off" placeholder="Playground access token"></p>
    <button id="pggo" type="button">List devices</button>
    <p class="err" id="pgerr" hidden></p>
    <ul id="pgout" style="margin-top:14px"></ul>
  </section>
  <button id="again" type="button" hidden>Check again</button>
</div>
<script>
(function(){
  "use strict";
  var g=function(id){ return document.getElementById(id); };
  function readKey(){ try{ return localStorage.getItem("kiosk_key"); }catch(e){ return null; } }
  function writeKey(v){ try{ localStorage.setItem("kiosk_key",v); }catch(e){} }

  // Grouped in the order the setup is done.
  var STEPS=[
    {title:"Step 1 · Passwords", rows:[
      {env:"KIOSK_KEY", name:"Setup key"},
      {env:"SEND_PIN", name:"Message PIN"},
      {env:"CRON_SECRET", name:"Background job secret"}]},
    {title:"Step 2 · Storage", rows:[
      {env:"BLOB_READ_WRITE_TOKEN", name:"Blob store connected"},
      {check:"blob", name:"Blob store answers"},
      {check:"edgeRead", name:"Edge Config answers"},
      {env:"EDGE_CONFIG_ID", name:"Edge Config ID"},
      {env:"VERCEL_API_TOKEN", name:"Vercel token"},
      {check:"edgeWrite", name:"ID and token work together"}]},
    {title:"Step 3 · Ring", rows:[
      {env:"RING_ID", name:"Ring client id"},
      {env:"RING_SECRET", name:"Ring client secret"},
      {env:"RING_HMAC", name:"Ring webhook secret"},
      {check:"ringSeed", name:"Ring login token saved"},
      {env:"CAM_FRONT", name:"Front Door camera"},
      {env:"CAM_DRIVE", name:"Driveway camera"},
      {env:"CAM_BACK", name:"Back Verandah camera"},
      {env:"CAM_SHED", name:"Shed camera"},
      {env:"CAM_BELL", name:"Doorbell"}]},
    {title:"Step 4 · Google (calendar and photos)", rows:[
      {check:"google", name:"Service-account key"},
      {env:"GCAL_ID", name:"Calendar"},
      {env:"GDRIVE_FOLDER_ID", name:"Photo folder"}]}
  ];

  function render(j){
    var out=g("out"); out.innerHTML="";
    STEPS.forEach(function(s){
      var sec=document.createElement("section");
      var h=document.createElement("h2"); h.textContent=s.title; sec.appendChild(h);
      var ul=document.createElement("ul");
      s.rows.forEach(function(r){
        var ok, note="";
        if(r.env){ ok=!!j.env[r.env]; note=r.env+(ok?"":" · not set"); }
        else { var c=j.checks[r.check]||{}; ok=!!c.ok; note=c.note||""; }
        var li=document.createElement("li"); li.className=ok?"ok":"bad";
        li.innerHTML='<span class="dot"></span><span><span class="nm"></span><br><span class="note"></span></span>';
        li.querySelector(".nm").textContent=r.name;
        li.querySelector(".note").textContent=note;
        ul.appendChild(li);
      });
      sec.appendChild(ul); out.appendChild(sec);
    });
    if(j.devices){
      var sec=document.createElement("section");
      var h=document.createElement("h2"); h.textContent="Ring devices · copy each id into its CAM_ setting"; sec.appendChild(h);
      var ul=document.createElement("ul");
      if(j.devices.error){ var li=document.createElement("li"); li.className="bad"; li.textContent=j.devices.error; ul.appendChild(li); }
      else j.devices.forEach(function(d){
        var li=document.createElement("li"); li.className="ok";
        li.innerHTML='<span class="dot"></span><span><span class="nm"></span><br><span class="note"></span></span>';
        li.querySelector(".nm").textContent=d.name+(d.kind?" ("+d.kind+")":"");
        li.querySelector(".note").textContent=d.id;
        ul.appendChild(li);
      });
      sec.appendChild(ul); out.appendChild(sec);
    }
    g("again").hidden=false;
  }

  function check(key){
    g("err").hidden=true;
    fetch("/api/health",{headers:{"X-Kiosk-Key":key},cache:"no-store"}).then(function(r){
      if(r.status===401){ g("gate").hidden=false; throw new Error("That key was not accepted."); }
      if(!r.ok) throw new Error("The server had a problem ("+r.status+").");
      writeKey(key); g("gate").hidden=true;
      return r.json();
    }).then(render).catch(function(e){ g("err").textContent=e.message; g("err").hidden=false; });
  }

  g("go").addEventListener("click",function(){ var v=g("key").value.trim(); if(v) check(v); });
  g("key").addEventListener("keydown",function(e){ if(e.key==="Enter") g("go").click(); });
  g("again").addEventListener("click",function(){ var k=readKey(); if(k) check(k); });

  g("pggo").addEventListener("click",function(){
    var t=g("pgtok").value.trim(), key=readKey(); if(!t) return;
    g("pgerr").hidden=true; g("pgout").innerHTML="";
    if(!key){ g("pgerr").textContent="Enter the setup key at the top first."; g("pgerr").hidden=false; return; }
    fetch("/api/ring/devices",{method:"POST",headers:{"X-Kiosk-Key":key,"Content-Type":"application/json"},body:JSON.stringify({token:t}),cache:"no-store"})
      .then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j.error+(j.detail?" - "+j.detail:"")); return j; }); })
      .then(function(j){
        if(!j.devices.length){ g("pgerr").textContent="Ring returned no devices."; g("pgerr").hidden=false; return; }
        j.devices.forEach(function(d){
          var li=document.createElement("li"); li.className="ok";
          li.innerHTML='<span class="dot"></span><span><span class="nm"></span><br><span class="note"></span></span>';
          li.querySelector(".nm").textContent=d.name+(d.kind?" ("+d.kind+")":"");
          li.querySelector(".note").textContent="id "+d.id+(d.video?" · ratio "+d.video+" · BELL_ASPECT "+d.aspect:"");
          g("pgout").appendChild(li);
        });
      }).catch(function(e){ g("pgerr").textContent=e.message; g("pgerr").hidden=false; });
  });

  var k=readKey();
  if(k) check(k); else g("gate").hidden=false;
})();
</script>
</body></html>
